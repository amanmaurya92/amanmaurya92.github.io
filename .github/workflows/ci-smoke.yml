name: CI - Build & Smoke

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Smoke test API
        env:
          NODE_ENV: test
          PORT: 5050
          ALLOWED_ORIGINS: ""
        run: |
          node server.js &
          SERVER_PID=$!
          echo "Waiting for API..."
          for i in {1..30}; do
            if curl -fsS http://localhost:5050/api/health > /dev/null; then
              echo "API is up."
              break
            fi
            sleep 1
          done

          curl -fsS http://localhost:5050/api/health
          curl -fsS http://localhost:5050/api/profile
          curl -fsS "http://localhost:5050/api/projects?featured=true"

          kill $SERVER_PID

